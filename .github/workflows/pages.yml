name: Deploy TechDesk Web

# Publishes the built app to GitHub Pages on every push to main.
#
# Pages must be switched on once by hand: Settings -> Pages -> Source ->
# "GitHub Actions". Until that is done this workflow builds fine and the
# deploy step fails, which looks like a broken build but is not.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Pages needs these; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is dropped rather than cancelled, so a
# quick second push does not abandon the deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The app is served from a subpath (/<repo>/), and it routes on the hash,
      # so relative asset paths in vite.config.js are enough. This copy is the
      # 404 fallback: a hard refresh on any URL lands here and the hash router
      # takes it from there.
      - name: Add a 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
