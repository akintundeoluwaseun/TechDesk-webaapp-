name: CI

# Tests and builds on every push, and nothing else.
#
# This used to be part of the deploy workflow, which meant a repository with
# no deploy target configured showed a red cross on every single push --
# eight in a row, all of them saying "failure" while the tests and the build
# were passing perfectly. A checkmark that is always red teaches you to stop
# looking at it, and the next real failure goes unnoticed.
#
# So: does the code work is this workflow. Did it reach anyone is deploy.yml.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
