name: Deploy TechDesk Web

# The app has to actually reach the shops using it, and for a long time it did
# not: the repository built cleanly on every push and deployed nowhere, while
# the live copy at techdeskweb.vercel.app stayed on an old build. A fix could
# be written, reviewed, merged, and still not be in front of anyone.
#
# ONE OF THESE TWO HAS TO BE SET UP. Both can be, and then the app is
# published in both places.
#
#   VERCEL  -- keeps the existing URL, which is the one the website links to.
#              Add three repository secrets, from vercel.com:
#                VERCEL_TOKEN      Account Settings -> Tokens
#                VERCEL_ORG_ID     Project Settings -> General
#                VERCEL_PROJECT_ID Project Settings -> General
#              (Or skip all this: connect the Vercel project to this
#              repository in Vercel's own dashboard and it deploys itself.)
#
#   PAGES   -- free and needs no account, but the URL changes to
#              <owner>.github.io/<repo>/, so the website's Web App link has to
#              change with it. Settings -> Pages -> Source -> "GitHub Actions".
#
# A target that is not configured is SKIPPED, not failed. A red cross that
# means "you have not chosen yet" is indistinguishable from one that means
# "you broke it", and the repository spent eight pushes in that state.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is dropped rather than cancelled, so a
# quick second push does not abandon the deploy already in flight.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.targets.outputs.vercel }}
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Which targets are configured?
        id: targets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "vercel=true" >> "$GITHUB_OUTPUT"
            echo "Vercel: configured."
          else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel not configured (no VERCEL_TOKEN) -- skipping."
          fi

      - run: npm ci
      - run: npm test

      # GITHUB_SHA is read by vite.config.js and shown in Settings ->
      # Developer, so "is the fix live?" is answerable by looking at the app
      # rather than by reading the bundle.
      - run: npm run build

      # The app routes on the hash and its assets are referenced relatively
      # (base: "./"), so it works from any subpath. This copy is the fallback
      # for a hard refresh on a URL the host does not have a file for.
      - name: Add a 404 fallback
        run: cp dist/index.html dist/404.html

      # Deploying something that does not start is worse than not deploying:
      # it replaces a working old build with a broken new one. Load the built
      # app from a subpath, exactly as Pages serves it, before it goes
      # anywhere.
      - name: Check the build actually runs
        run: |
          mkdir -p serve/app && cp -r dist/* serve/app/
          (cd serve && python3 -m http.server 8099 &) && sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/app/)
          [ "$code" = "200" ] || { echo "::error::Built app did not serve (HTTP $code)"; exit 1; }
          asset=$(grep -oP '(?<=src=")[^"]*\.js' dist/index.html | head -1 | sed 's|^\./||')
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099/app/$asset")
          [ "$code" = "200" ] || { echo "::error::Built app's script 404s from a subpath (HTTP $code)"; exit 1; }
          echo "Serves from a subpath, scripts resolve."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist

      - name: Say so if Pages is not switched on
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository, so it was skipped."
          echo "To publish here: Settings -> Pages -> Source -> \"GitHub Actions\"."
          echo "Note that this changes the app's URL, so the website's Web App link must change too."

  pages:
    needs: build
    # Only when Pages is actually switched on. Without this the job still
    # runs, fails on the github-pages environment before reaching any step,
    # and reports a red cross that means nothing.
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  vercel:
    needs: build
    if: needs.build.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Vercel builds from source rather than taking dist/, so that the
      # deployment's own record of what it built matches this commit.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Web App deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
